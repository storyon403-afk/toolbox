<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LanguageMap</title><link rel="stylesheet" href="app.css"></head><body data-theme="mono">
<div class="review-shell"><div class="review" id="appearance-controls"><span class="review-title">外观</span><select id="ui-language" aria-label="界面语言"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option></select><div class="variants" aria-label="视觉款式"><button data-theme-choice="mono" aria-pressed="true">黑白</button><button data-theme-choice="glass" aria-pressed="false">半透明</button></div></div><button id="toggle-review" class="icon" aria-label="收起外观栏" aria-controls="appearance-controls" aria-expanded="true" data-icon="up"></button></div>
<div id="stage"><main id="product" aria-label="LanguageMap 语言学习" data-view="home">
<header class="app-header"><button id="back" class="icon" aria-label="返回时间轴" data-icon="chevronLeft" hidden></button><button class="brand" id="brand-home" aria-label="返回时间轴" title="时间轴"><span class="brand-glyph" data-design="text" aria-hidden="true"><img src="mark.svg" width="30" height="30" alt=""></span></button><div id="date-crumb" hidden><span data-design="text">/</span><b data-design="text" id="date-label">11.04</b><span data-design="text" id="weekday">周三</span></div><div class="header-right"><button class="history-trigger" id="open-history" aria-label="打开记录查询" data-design="rect"><span data-icon="layers"></span><span data-design="text">记录查询</span></button><button id="open-search" class="search-trigger" aria-label="搜索所有日期的单词" data-design="rect"><span data-icon="search"></span><span data-design="text">搜索单词</span><kbd data-design="text">⌘ K</kbd></button></div></header>
<section id="home" aria-label="时间箭头首页"><div class="timeline-heading"><div><div class="eyebrow" id="timeline-year" data-design="text">2026</div><h1 id="timeline-month" data-design="text">十一月</h1></div><div class="timeline-navigation"><button class="icon" id="timeline-prev" aria-label="更早的日期" data-icon="chevronLeft"></button><button class="icon" id="timeline-next" aria-label="更晚的日期" data-icon="chevronRight"></button></div></div><div class="timeline-stage" tabindex="0" aria-label="拖动浏览日期"><svg class="timeline-track" viewBox="0 0 1000 12" preserveAspectRatio="none" aria-label="时间箭头"><path d="M0 6 H998 M992 1 L998 6 L992 11" fill="none" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"/></svg><div id="dates"></div></div><div id="empty-home"><p>从今天遇见的第一个词开始。</p><button id="start-today">记录今天的新词 ↗</button></div><div class="timeline-footer"><button id="timeline-first" data-design="text">始于 2024.03.17</button><span data-design="text">单击预览 · 双击进入</span><button id="timeline-latest" data-design="text">回到最近 ↗</button></div></section>
<div class="candidate" id="candidate" hidden data-design="rect"><div class="candidate-heading"><span id="candidate-date" data-design="text"></span><small id="candidate-count" data-design="text"></small><button class="icon" id="close-peek" data-icon="close" aria-label="收起候选"></button></div><div id="candidate-list"></div><button id="enter-day" data-design="rect"><span data-design="text">进入当天画布</span><span data-design="text">↗</span></button></div>
<section id="map" hidden aria-label="当天的全部单词网络"><div id="empty-map"><p>一个词，一张慢慢生长的地图。</p><button id="empty-add">添加第一个词 ＋</button></div><div id="canvas" aria-label="可拖动和缩放的无限画布"><div id="world"><svg id="edges" width="5000" height="4000" viewBox="-2000 -1500 5000 4000" aria-hidden="true"></svg><div id="nodes"></div><div id="anchor-preview" hidden data-design="rect"><span data-design="rect"></span><i data-design="text">新词起点</i></div><div class="note" id="native-note" hidden data-design="rect"><div class="note-head"><span data-design="text">母语释义</span><button id="delete-word" aria-label="删除当前词网" title="删除当前词网">删除</button><button class="icon" data-note-close="native" data-icon="minus" aria-label="收起母语释义"></button></div><div id="native-editor" contenteditable="true" role="textbox" aria-label="母语释义" data-design="text" spellcheck="false"></div></div><div class="note" id="foreign-note" hidden data-design="rect"><div class="note-head"><span data-design="text">外语释义</span><button class="icon" data-note-close="foreign" data-icon="minus" aria-label="收起外语释义"></button></div><div id="foreign-editor" contenteditable="true" role="textbox" aria-label="外语释义" data-design="text" spellcheck="false"></div><div class="note-actions"><span id="selection-hint">选中一个词，继续延伸</span><button id="link-word" type="button" hidden><span data-icon="prototype"></span><span id="link-label">连接单词</span></button></div></div></div></div>
<div class="insert-dock" id="insert-dock" data-design="rect"><button class="insert-toggle" id="insert-toggle" aria-label="展开新词输入栏" aria-expanded="false"><span data-icon="plus"></span><span data-design="text">新词</span><span data-icon="down"></span></button><form id="insert-form" hidden><span data-icon="text"></span><input data-design="text" id="new-word" placeholder="遇见了哪个新词？" aria-label="新单词" maxlength="60" autocomplete="off"><button type="submit" class="commit" aria-label="插入到空白锚点" data-icon="plus"></button><button type="button" id="close-insert" class="icon" aria-label="收起输入栏" data-icon="up"></button></form></div>
<div class="map-tools" data-design="rect"><button class="icon active" id="select-tool" data-icon="cursor" aria-label="选择模式"></button><button class="icon" id="hand-tool" data-icon="hand" aria-label="拖动画布"></button></div><div class="map-footer"><span id="map-count" data-design="text"></span><span class="quiet-hint" data-design="text" id="map-hint">点击单词展开释义</span><div class="zoom-tools" data-design="rect"><button class="icon" id="zoom-out" data-icon="minus" aria-label="缩小"></button><span id="zoom-value" data-design="text">100%</span><button class="icon" id="zoom-in" data-icon="plus" aria-label="放大"></button><button class="icon" id="fit" data-icon="fit" aria-label="查看全部词网"></button></div></div><button id="close-focus" hidden data-design="rect"><span data-icon="close"></span><span data-design="text">收起释义</span></button>
</section><div id="toast" role="status"></div></main></div>

<dialog id="history-dialog" aria-label="记录查询" data-design="rect"><div class="query-titlebar"><span data-design="text">记录查询</span><button class="icon" id="close-history" aria-label="关闭记录查询" data-icon="close"></button></div><div id="history-body">
<div class="query-level" role="group" aria-label="查询层级"><button id="query-month" aria-pressed="true" data-design="rect"><span data-design="text">月</span></button><button id="query-year" aria-pressed="false" data-design="rect"><span data-design="text">年</span></button></div>
<div class="year-heading"><div><div class="year-title"><h1 id="year-heading" data-design="text">十一月</h1><span class="year-suffix" id="query-period" data-design="text">2026</span></div></div><div class="year-actions"><div class="year-picker" data-design="rect"><button class="icon" id="prev-year" aria-label="上一月" data-icon="chevronLeft"></button><select id="year-select" aria-label="查看年份"></select><select id="month-select" aria-label="查看月份"></select><button class="icon" id="next-year" aria-label="下一月" data-icon="chevronRight"></button></div></div></div>
<div class="year-summary"><span id="year-total" data-design="text"></span></div>
<div id="year-view" class="period-view" aria-label="按月查看每日记录"><div class="plot-scroll" tabindex="0" aria-label="横向浏览记录与曲线"><div class="aligned-plot daily-plot"><div id="query-days" class="period-strip"></div><svg id="daily-curve" class="aligned-curve" role="img" aria-label="每日记录词数曲线"></svg></div></div></div>
<div id="years-view" class="period-view" aria-label="按年查看每月记录" hidden><div class="plot-scroll" tabindex="0" aria-label="横向浏览记录与曲线"><div class="aligned-plot monthly-plot"><div id="query-months" class="period-strip"></div><svg id="monthly-curve" class="aligned-curve" role="img" aria-label="每月累计记录词数曲线"></svg></div></div></div>
</div></dialog>
<dialog data-design="rect" id="search-dialog" aria-label="搜索所有单词"><div class="search-box" data-design="rect"><div class="search-input-row"><span data-icon="search"></span><input id="word-search" aria-label="查找已记录单词" placeholder="一个单词，一段来处。" autocomplete="off"><button id="close-search" class="icon" data-icon="close" aria-label="关闭搜索"></button></div><div class="search-caption"><span data-design="text">所有日期</span><span id="search-count" data-design="text"></span></div><div id="search-results" role="listbox" aria-label="单词搜索结果"></div><div class="search-footer"><span data-design="text">↑ ↓ 选择</span><span data-design="text">↵ 定位到词网</span></div></div></dialog>
<footer class="review-foot"><span id="save-status" role="status">已保存在本机</span><span>LanguageMap · 1.0</span><span>拖动平移 · ⌘/Ctrl + 滚轮缩放</span></footer>
<script src="forma-icons.js"></script><script src="note-links.js?v=7"></script><script src="canvas-input.js?v=7"></script><script src="i18n.js?v=7"></script><script src="timeline-input.js?v=7"></script><script src="app.js"></script><script src="platform.js"></script></body></html>
